server:
  port: 8081

spring:
  profiles:
    active: local
  application:
    name: station-service

  datasource:
    url: jdbc:h2:mem:station-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri is fetched lazily (only when validating a token), so the service
          # starts independently without Keycloak running.
          jwk-set-uri: http://localhost:9090/realms/railway/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  config: classpath:logback-spring.xml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
