
# Disable Keycloak JWT validation in local profile (no Keycloak required)
# The jwk-set-uri below is ignored because LocalSecurityConfig permits all requests.

eureka:
  client:
    # Allow startup even if Eureka/discovery-service is not running
    enabled: true
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
