server:
  port: 8084

spring:
  profiles:
    active: local
  application:
    name: booking-service

  datasource:
    url: jdbc:h2:mem:booking-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri is fetched lazily (only when validating a token), so the service
          # starts independently without Keycloak running.
          jwk-set-uri: http://localhost:9090/realms/railway/protocol/openid-connect/certs

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: booking-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.railway.booking.kafka.event"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000

app:
  kafka:
    topic:
      booking-initiated: booking-initiated
      booking-created: booking-created
      booking-cancelled: booking-cancelled
      booking-failed: booking-failed
      payment-requested: payment-requested
      payment-completed: payment-completed
      payment-failed: payment-failed
      seat-reserved: seat-reserved
      seat-reservation-failed: seat-reservation-failed

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  config: classpath:logback-spring.xml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
