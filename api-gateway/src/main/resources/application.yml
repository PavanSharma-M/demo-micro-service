server:
  port: 8080

spring:
  profiles:
    active: local
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri is fetched lazily (only when validating a token), so the gateway
          # starts independently without Keycloak running.
          # Override via env var SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI in Docker
          jwk-set-uri: http://localhost:9090/realms/railway/protocol/openid-connect/certs

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: station-service
          uri: lb://station-service
          predicates:
            - Path=/api/v1/stations/**

        - id: train-service
          uri: lb://train-service
          predicates:
            - Path=/api/v1/trains/**

        - id: route-service
          uri: lb://route-service
          predicates:
            - Path=/api/v1/routes/**

        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/v1/bookings/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
