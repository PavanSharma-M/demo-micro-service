spring.application.name=railway-microservice
server.port=8080

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:railwaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Ensure data.sql runs after Hibernate creates tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ─── Apache Kafka ────────────────────────────────────────────────
# Broker address — change to your Kafka host:port in production
spring.kafka.bootstrap-servers=localhost:9092

# Producer: serialize event objects to JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer: deserialize JSON back to BookingEvent
spring.kafka.consumer.group-id=railway-booking-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.demo_micro_service.kafka.event

# Topic names
app.kafka.topic.booking-created=booking-created
app.kafka.topic.booking-cancelled=booking-cancelled

# ─── Saga Topics ─────────────────────────────────────────────────
# Step 1 → Step 2 : BookingService publishes here to start the saga
app.kafka.topic.booking-initiated=booking-initiated
# Step 2 → Step 3 : SeatReservationSagaHandler publishes success here
app.kafka.topic.seat-reserved=seat-reserved
# Step 2 → Step 3 : SeatReservationSagaHandler publishes failure here (compensation trigger)
app.kafka.topic.seat-reservation-failed=seat-reservation-failed
# Step 3 (success) : BookingSagaCompletionHandler publishes final confirmation
app.kafka.topic.booking-confirmed=booking-confirmed
# Step 3 (failure) : BookingSagaCompletionHandler publishes after compensation
app.kafka.topic.booking-failed=booking-failed
