x-railway-app: &railway-app
  image: railway-microservices:local
  build:
    context: .
    dockerfile: Dockerfile

services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    volumes:
      - ./keycloak/railway-realm.json:/opt/keycloak/data/import/railway-realm.json
    ports:
      - "9090:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/realms/railway || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  discovery-service:
    <<: *railway-app
    container_name: discovery-service
    environment:
      SERVICE_JAR: discovery-service.jar
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8

  api-gateway:
    <<: *railway-app
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVICE_JAR: api-gateway.jar
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/railway/protocol/openid-connect/certs
    depends_on:
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  station-service:
    <<: *railway-app
    container_name: station-service
    ports:
      - "8081:8081"
    environment:
      SERVICE_JAR: station-service.jar
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/railway/protocol/openid-connect/certs
    depends_on:
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  train-service:
    <<: *railway-app
    container_name: train-service
    ports:
      - "8082:8082"
    environment:
      SERVICE_JAR: train-service.jar
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/railway/protocol/openid-connect/certs
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy

  route-service:
    <<: *railway-app
    container_name: route-service
    ports:
      - "8083:8083"
    environment:
      SERVICE_JAR: route-service.jar
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/railway/protocol/openid-connect/certs
    depends_on:
      station-service:
        condition: service_started
      train-service:
        condition: service_started

  booking-service:
    <<: *railway-app
    container_name: booking-service
    ports:
      - "8084:8084"
    environment:
      SERVICE_JAR: booking-service.jar
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/railway/protocol/openid-connect/certs
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      route-service:
        condition: service_started
      train-service:
        condition: service_started
      kafka:
        condition: service_healthy

  payment-service:
    <<: *railway-app
    container_name: payment-service
    ports:
      - "8086:8086"
    environment:
      SERVICE_JAR: payment-service.jar
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_healthy

  order-service:
    <<: *railway-app
    container_name: order-service
    ports:
      - "8085:8085"
    environment:
      SERVICE_JAR: order-service.jar
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/railway/protocol/openid-connect/certs
    depends_on:
      booking-service:
        condition: service_started
      keycloak:
        condition: service_healthy
